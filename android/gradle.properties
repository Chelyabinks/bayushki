org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Адрес сервера по умолчанию (статический домен ngrok). Можно поменять в мастере настройки.
serverUrl=https://example-name.ngrok-free.app
# Репозиторий GitHub для самообновления (owner/name). В CI подставляется автоматически.
githubRepo=OWNER/REPO
